set -g default-terminal screen-256color
set-option -ga update-environment 'CONDA_DEFAULT_ENV'

# vim key bindings
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# switch between tmux windows
bind H previous-window
bind L next-window

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatically restore the last saved tmux environment
set -g @continuum-restore 'on'

# ── Passthrough toggle ────────────────────────────────────────────
# F12: outer tmux goes deaf, C-b reaches the nested session directly
bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style 'fg=colour245,bg=colour238' \;\
  if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
  refresh-client -S

# F12 again: wake it back up
bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  refresh-client -S

# Visible indicator so you always know which tmux you're driving
set -g status-right '#{?#{==:#{client_key_table},off},#[fg=colour232#,bg=colour208] OFF ,}#[default] %H:%M '

# Bootstrap TPM install
if "test ! -d ~/.tmux/plugins/tpm" \
    "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TPM
run '~/.tmux/plugins/tpm/tpm'
