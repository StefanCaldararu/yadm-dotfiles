# Tempus Future theme for tmux. Sourced from ~/.tmux.conf *after*
# ~/.config/tempus/colors (tmux reads a whole file before running it, so the
# colors must be set by an earlier source-file to be visible here).

# Expose the colors as options too, for places that are evaluated later,
# e.g. key bindings and status formats: #{@tempus_green}
set -g @tempus_bg "${TEMPUS_BG}"
set -g @tempus_fg "${TEMPUS_FG}"
set -g @tempus_red "${TEMPUS_RED}"
set -g @tempus_green "${TEMPUS_GREEN}"
set -g @tempus_yellow "${TEMPUS_YELLOW}"
set -g @tempus_blue "${TEMPUS_BLUE}"
set -g @tempus_magenta "${TEMPUS_MAGENTA}"
set -g @tempus_cyan "${TEMPUS_CYAN}"
set -g @tempus_orange "${TEMPUS_ORANGE}"
set -g @tempus_alt_fg "${TEMPUS_ALT_FG}"
set -g @tempus_alt_bg "${TEMPUS_ALT_BG}"

# Status bar
set -g status-style "fg=colour${TEMPUS_FG},bg=colour${TEMPUS_ALT_BG}"
set -g status-left-style "fg=colour${TEMPUS_GREEN},bold"
set -g window-status-style "fg=colour${TEMPUS_ALT_FG}"
set -g window-status-current-style "fg=colour${TEMPUS_BG},bg=colour${TEMPUS_YELLOW},bold"
set -g window-status-activity-style "fg=colour${TEMPUS_YELLOW}"
set -g window-status-bell-style "fg=colour${TEMPUS_RED},bold"

# Command line and messages
set -g message-style "fg=colour${TEMPUS_FG},bg=colour${TEMPUS_ALT_BG}"
set -g message-command-style "fg=colour${TEMPUS_YELLOW},bg=colour${TEMPUS_ALT_BG}"

# Pane borders (the active one is green by default)
set -g pane-border-style "fg=colour${TEMPUS_ALT_BG}"
set -g pane-active-border-style "fg=colour${TEMPUS_YELLOW}"
set -g display-panes-colour "colour${TEMPUS_ALT_FG}"
set -g display-panes-active-colour "colour${TEMPUS_YELLOW}"

# Copy mode / selections
set -g mode-style "fg=colour${TEMPUS_BG},bg=colour${TEMPUS_YELLOW}"
set -g copy-mode-match-style "fg=colour${TEMPUS_BG},bg=colour${TEMPUS_CYAN}"
set -g copy-mode-current-match-style "fg=colour${TEMPUS_BG},bg=colour${TEMPUS_ORANGE}"
set -g clock-mode-colour "colour${TEMPUS_YELLOW}"
